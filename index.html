<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手相でわかる あなたの取扱説明書｜才能・金運タイプ診断｜望月ゆい</title>
    <meta name="description" content="右手を見ながら答えるだけ。全8問・約2分・無料。あなたが生まれ持った才能と、これからの金運タイプがわかります。">
    <meta property="og:title" content="手相でわかる あなたの取扱説明書｜才能・金運タイプ診断">
    <meta property="og:description" content="右手を見ながら答えるだけ。全8問・約2分・無料。">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#1c1838">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sky" aria-hidden="true"></div>

    <main class="container">
        <!-- スタート -->
        <section class="screen" id="startScreen">
            <div class="start-hero" aria-hidden="true">
                <div class="moon moon-large"></div>
                <div class="start-hand" id="startHand"></div>
            </div>
            <p class="eyebrow" id="startEyebrow"></p>
            <h1 class="start-title" id="startTitle"></h1>
            <p class="start-subtitle" id="startSubtitle"></p>
            <ul class="badges" id="startBadges"></ul>
            <p class="start-lead" id="startLead"></p>
            <div class="hand-tip">
                <span class="hand-tip-icon" aria-hidden="true">✋</span>
                <span id="handTip"></span>
            </div>
            <button class="btn btn-primary" id="startBtn">診断をはじめる</button>
            <div class="reader-mini" id="readerMini"></div>
        </section>

        <!-- 質問 -->
        <section class="screen hidden" id="questionScreen">
            <div class="q-top">
                <button class="btn-back" id="backBtn">‹ 戻る</button>
                <div class="q-count"><span id="qNum">1</span><small> / <span id="qTotal">8</span></small></div>
            </div>
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            <p class="q-label-en" id="qLabelEn"></p>
            <h2 class="q-title" id="qTitle"></h2>
            <p class="q-help" id="qHelp"></p>
            <div id="qOptions"></div>
            <div id="qFooter"></div>
        </section>

        <!-- 読み解き中 -->
        <section class="screen hidden" id="loadingScreen">
            <div class="loading">
                <div class="moon moon-spin" aria-hidden="true"></div>
                <p class="loading-text" id="loadingText">右手の線を読み解いています…</p>
            </div>
        </section>

        <!-- 結果 -->
        <section class="screen hidden" id="resultScreen"></section>
    </main>

    <!-- 追従LINEボタン -->
    <div class="sticky-cta hidden" id="stickyCta">
        <a class="btn btn-line" id="stickyLineBtn" href="#" target="_blank" rel="noopener">
            続きをLINEで無料で受け取る
        </a>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="hand.js"></script>
    <script src="palm-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
